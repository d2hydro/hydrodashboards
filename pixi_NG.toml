[project]
name = "hydrodashboards"
version = "0.6.2"
description = "Dashboards for HydroData"
channels = ["conda-forge"]
platforms = ["win-64"]
readme = "README.md"
license = "MIT"
license-file = "LICENSE"

[tasks]
dash = "python dash\\app.py"
dash_ng = "python dash\\app_NG.py"

[dependencies]
aiohttp = "*"
nest-asyncio = "*"
pandas = "*"
geopandas = "*"
requests = "*"
bokeh = "*"
fastapi = "*"
dash = "*"
dash-leaflet = "*"
ipykernel = "*"
fiona = "*"
shapely = "*"
pyproj = "*"
ribasim = "==2025.4.0"
pyarrow = ">=10.0.1"

[pypi-dependencies]
dash-resizable-panels ="*"
dash-split-pane = "*"
dash-extensions = "*"
