[project]
name = "hydrodashboards"
version = "0.6.2"
description = "Dashboards for HydroData"
channels = ["conda-forge"]
platforms = ["win-64"]
readme = "README.md"
license = "MIT"
license-file = "LICENSE"

[tasks]
dash = "python dash\\app.py"

[dependencies]
aiohttp = "*"
nest-asyncio = "*"
pandas = "*"
geopandas = "*"
requests = "*"
bokeh = "*"
dash = "*"
dash-leaflet = "*"
ipykernel = "*"

[pypi-dependencies]
dash-resizable-panels = "*"
